# Use conda-forge for numpy and astropy so they share the same C ABI and avoid
# "numpy.ndarray size changed, may indicate binary incompatibility" (Expected 80, got 96).
# Minimal conda deps (no anaconda metapackage) for fast env create; rest via pip.
name: csromer-env
channels:
- conda-forge
dependencies:
- python=3.8
- numpy=1.24
- astropy>=5.2
- pip
- blas
- blas-devel
- libblas
- libcblas
- liblapack
- liblapacke
- pip:
  - -r requirements-conda.txt
