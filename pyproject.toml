# pyproject.toml for csromer (Pyralysis-style: no setup.py)
# Build system, metadata, and dependencies. Dependencies are read from requirements-conda.txt
# so that conda envs keep numpy/astropy from conda-forge (ABI compatibility).
# For pip-only install: pip install -r requirements.txt then pip install -e .

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=70.0.0", "setuptools-scm>=8", "wheel"]

[project]
authors = [
  {name = "Miguel Cárcamo", email = "miguel.carcamo@manchester.ac.uk"}
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent"
]
description = "Compressed Sensing Rotation Measure Reconstructor"
dynamic = ["version", "dependencies"]
license = {text = "GNU GPL"}
maintainers = [
  {name = "Miguel Cárcamo", email = "miguel.carcamo@manchester.ac.uk"}
]
name = "csromer"
readme = "README.md"
requires-python = ">=3.8"

[project.urls]
Source = "https://github.com/miguelcarcamov/csromer"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
dependencies = {file = "requirements-conda.txt"}

[tool.setuptools.package-data]
"csromer.faraday_sky" = ["*.fits", "*.hdf5"]

[tool.setuptools.packages.find]
include = ["csromer*"]
namespaces = false
where = ["src"]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "src/csromer/_version.py"

[tool.pytest.ini_options]
# So "import csromer" works when running pytest from repo root (with or without pip install -e .)
pythonpath = ["src"]
# Collect from both unit and integration (default would too, but this makes it explicit)
testpaths = ["tests"]
markers = [
    "integration: full pipeline tests (simulate -> reconstruct). Require PyWavelets.",
]
