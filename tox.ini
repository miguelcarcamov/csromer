; tox configuration for csromer.
;
; Environments are created by uv (via tox-uv), which is substantially faster than
; virtualenv+pip and resolves the pinned requirements consistently across versions.
;
;   tox                 run the test suite on every supported Python
;   tox -e py311        run it on one
;   tox -e lint         run the pre-commit hooks
;   tox -e py311 -- -m slow    pass extra args through to pytest
;
; Supported range is 3.9-3.11 and that is a hard ceiling today, not a preference:
; scipy==1.10.0, astropy==5.2.1, matplotlib==3.6.3 and PyWavelets==1.4.1 publish no
; wheels beyond cp311. On 3.12+ they fall back to building from source, which is slow
; and frequently fails. Raising the ceiling means bumping those pins first.
;
; prox_tv and pynufft ship no wheels at all and always build from source, so a cold
; environment needs a C/C++ toolchain available.

[tox]
envlist = py39, py310, py311
isolated_build = true
requires =
    tox>=4.11
    tox-uv>=1.11

[testenv]
runner = uv-venv-runner
description = Run the test suite under {basepython}
deps =
    -r requirements.txt
    pytest>=7.0
    pytest-cov
commands =
    pytest {posargs:tests/} \
        --cov=csromer \
        --cov-report=xml:coverage.xml \
        --cov-report=term-missing \
        -W ignore

[testenv:lint]
description = Run the pre-commit hooks over the whole tree
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
