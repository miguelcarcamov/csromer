name: build-latest-container

# Pushes the `latest` tag, so it must not run pre-merge: on a pull_request this would
# publish an image built from unmerged code. Master is the pre-release stage; release is
# the final one.
on:
  push:
    branches: [master]
    paths:
    - '**.py'
    - requirements*.txt
    - pyproject.toml
  release:
    types: [published]

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3.0.2
      with:
        fetch-depth: 0
        set-safe-directory: true
    - name: Check git version and our path
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: pre-commit/action@v3.0.1
      env:
        # dockerfilelint flags two pre-existing Dockerfile issues (an unpinned
        # `ubuntu:latest` base, and `--no-install-recommends` passed with no package
        # names so it is a no-op). Both are real and worth fixing, but pinning the
        # base tag changes the image's Python version, so that is a deliberate change
        # rather than a lint cleanup. Skipped here so it does not gate every push.
        SKIP: dockerfilelint
  build:
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: ghcr.io/${{ github.repository }}:base
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
    - uses: actions/checkout@v3.0.2
      with:
        fetch-depth: 0
        set-safe-directory: true
    - name: Force directory safe
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade wheel setuptools setuptools_scm
        python3 -m pip install virtualenv
        python3 -m pip install build
    - name: Build package
      run: python3 -m build
    - name: Install csromer
      run: pip3 install dist/*.tar.gz
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        path: dist/*
    - name: Run commands to test that everything is finished
      run: |
        pip3 freeze | grep "csromer"
        python3 -c "import csromer"
  build-latest-container:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout Code
      uses: actions/checkout@v1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v2
      with:
        file: ./Dockerfile.prod
        push: true   # Will only build if this is not here
        tags: ${{ env.REGISTRY }}/${{ github.repository }}:latest
