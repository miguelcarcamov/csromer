name: build-base-container

# Docker image builds belong on the release path only: a PR that targets master.
on:
  pull_request:
    branches:
    - master
    paths:
    - Dockerfile
env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # Runs every hook in .pre-commit-config.yaml -- yapf and isort, but also nbqa on
    # the notebooks, markdownlint and the YAML/TOML formatters. Replaces a bare yapf
    # action that covered only part of what the repo already enforces locally, and
    # that was pinned to a mutable branch.
    - uses: pre-commit/action@v3.0.1
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3.0.2
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v2
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v2
      with:
        push: true   # Will only build if this is not here
        tags: ${{ env.REGISTRY }}/${{ github.repository }}:base
