name: build

on:
  push:
    branches:
    - '**'
  pull_request:

# Supersede in-flight runs for the same ref rather than letting them pile up. The test
# matrix is the expensive part, so this matters now that every push triggers it.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3.0.2
    - uses: ptxmac/yapf-action@master
      with:
        args: --recursive --verbose

  test-matrix:
    # Version-compatibility signal: installs from the pinned requirements with uv and
    # runs the suite on each supported interpreter. Independent of the container-based
    # `test` job below, which exercises the conda-provided (ABI-matched) environment.
    #
    # The ceiling is 3.11 because scipy/astropy/matplotlib/PyWavelets publish no wheels
    # past cp311 at the versions pinned in requirements.txt. See tox.ini.
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: '3.9'
          toxenv: py39
        - python-version: '3.10'
          toxenv: py310
        - python-version: '3.11'
          toxenv: py311
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: requirements*.txt
    - name: Install Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}
    - name: Install tox
      run: uv tool install tox --with tox-uv
      # prox_tv and pynufft are source-only distributions; ubuntu-latest already
      # provides the toolchain they need to compile.
    - name: Run tox
      run: tox -e ${{ matrix.toxenv }}
    - name: Upload coverage
      # One upload is enough; the suite is the same across the matrix.
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    # Release-path packaging check: only when a PR actually targets master. Needs
    # registry credentials, and adds nothing on a day-to-day push or on a PR between
    # feature branches, where test-matrix is the signal that matters.
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: ghcr.io/${{ github.repository }}:base
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
    - uses: actions/checkout@v3.0.2
      with:
        fetch-depth: 0
        set-safe-directory: true
    - name: Force directory safe
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --upgrade wheel setuptools setuptools_scm
        python3 -m pip install virtualenv
        python3 -m pip install build
    - name: Build package
      run: python3 -m build
    - name: Install csromer
      run: pip3 install dist/*.tar.gz
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: csromer-artifacts
        path: dist/*
    - name: Run commands to test that everything is OK
      run: |
        pip3 freeze | grep "csromer"
        python3 -c "import csromer"
  test:
    # Runs the suite inside the prebuilt base image, i.e. against the conda-provided
    # (ABI-matched) stack rather than the pip-resolved one in test-matrix. Different
    # question, so it is kept -- but only on the release path (PR to master), since
    # test-matrix already covers every supported interpreter on every push and PR.
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/${{ github.repository }}:base
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
    - uses: actions/checkout@v3.0.2
      with:
        fetch-depth: 0
        set-safe-directory: true
    - name: Force directory safe
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install pytest and pycov
      run: |
        pip3 install pytest
        pip3 install pytest-cov
    - uses: actions/download-artifact@v3
      id: download
      with:
        name: csromer-artifacts
        path: dist/
    - name: Install csromer from artifacts
      run: pip3 install dist/*.tar.gz
    - name: Test with pytest and pycov
      run: pytest --cov=csromer --cov-report xml:coverage.xml --cov-report term-missing tests/ -W "ignore" -v
    - uses: codecov/codecov-action@v2
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
        files: ./coverage.xml
        fail_ci_if_error: true # optional (default = false)
        verbose: true # optional (default = false)
