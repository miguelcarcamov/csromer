# `python3` by name, not by absolute path. Hook environments only need an
# interpreter new enough for the hooks themselves (one requires >=3.10); this is
# independent of the Python csromer supports. An absolute path here worked on one
# machine and broke every CI runner and contributor.
default_language_version:
  python: python3

repos:
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
  - id: pretty-format-toml
    args: [--autofix]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: requirements-txt-fixer
#-   repo: https://github.com/psf/black
#    rev: 22.3.0
#    hooks:
#    id: black
- repo: https://github.com/pryorda/dockerfilelint-precommit-hooks
  rev: v0.1.0
  hooks:
  - id: dockerfilelint
    stages: [pre-commit]

- repo: https://github.com/pycqa/isort
  rev: 8.0.1
  hooks:
  - id: isort

- repo: https://github.com/google/yapf
  rev: v0.43.0
  hooks:
  - id: yapf
    additional_dependencies: [toml]

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.48.0
  hooks:
  - id: markdownlint-fix
    entry: markdownlint -f README.md --disable MD013 MD036
        # args: [--disable MD013 MD036]
- repo: https://github.com/nbQA-dev/nbQA
  rev: 1.9.1
  hooks:
  - id: nbqa-isort
  - id: nbqa-yapf
    additional_dependencies: [toml, yapf]
